name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install ruff
        run: pip install ruff

      - name: Run ruff
        run: ruff check .

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package:
          - services/auth
          - services/products
          - services/orders
          - services/payments
          - libs/shopcommon
    defaults:
      run:
        working-directory: ${{ matrix.package }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install ${{ github.workspace }}/libs/shopcommon pytest
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run tests
        run: pytest

  build:
    needs: [lint, test]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: auth
            dockerfile: docker/python-service.Dockerfile
          - service: products
            dockerfile: docker/python-service.Dockerfile
          - service: orders
            dockerfile: docker/python-service.Dockerfile
          - service: payments
            dockerfile: docker/python-service.Dockerfile
          - service: frontend
            dockerfile: frontend/Dockerfile
    env:
      IMAGE: ghcr.io/bihkula/nitsora-${{ matrix.service }}:${{ github.sha }}
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      # 1. Build and keep the image on the runner (not pushed yet)
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          build-args: SERVICE=${{ matrix.service }}
          load: true
          tags: ${{ env.IMAGE }}

      # 2. Scan it. A critical vulnerability with a fix available fails the job here.
      - name: Vulnerability scan
        uses: anchore/scan-action@v6
        with:
          image: ${{ env.IMAGE }}
          severity-cutoff: critical
          only-fixed: true
          fail-build: true
          output-format: table

      # 3. Only on main, and only if the scan passed: push to ghcr.io
      - name: Log in to ghcr.io
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image
        if: github.event_name == 'push'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          build-args: SERVICE=${{ matrix.service }}
          push: true
          tags: ${{ env.IMAGE }}
          labels: org.opencontainers.image.source=https://github.com/Bihkula/nitsora-shop